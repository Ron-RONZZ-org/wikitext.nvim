name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: test (nvim ${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [stable, nightly]
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.version }}
      - name: Neovim version
        run: nvim --version | head -n 3
      - name: Run tests
        run: nvim --headless --clean -l tests/run.lua

  docs:
    name: docs and style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - name: Generate help tags
        run: nvim --headless --clean -c 'helptags doc' -c 'qa!'
      - name: Check that tags were written
        run: test -s doc/tags
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check .
